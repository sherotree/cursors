name: materialize-demo-gif
on:
  push:
    paths:
      - "media/demo.gif.b64"
      - "media/demo.gif.b64.*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode GIF and commit
        run: |
          set -euo pipefail
          if compgen -G "media/demo.gif.b64.*" > /dev/null; then
            cat $(ls media/demo.gif.b64.* | sort) > media/demo.gif.b64
          fi
          test -f media/demo.gif.b64
          base64 -d media/demo.gif.b64 > media/demo.gif
          head -c 6 media/demo.gif | grep -q GIF89a
          ls -la media/demo.gif
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/demo.gif
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "docs: materialize README demo GIF from base64"
          git push
